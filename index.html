<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappa Italia</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100dvh;
      background: #f0f2f5;
      color: #333;
      overflow: hidden;
    }

    /* ───── PANNELLO SINISTRO (desktop) ───── */
    #sidebar {
      width: 320px;
      min-width: 280px;
      background: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 10px rgba(0,0,0,.12);
      z-index: 1000;
    }

    #sidebar-header {
      background: #1565c0;
      color: #fff;
      padding: 18px 16px 14px;
    }

    #sidebar-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: .5px;
    }

    #sidebar-header p {
      font-size: .78rem;
      opacity: .8;
      margin-top: 2px;
    }

    /* form */
    #form-box {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }

    #form-box label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    #form-box input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 10px;
      transition: border-color .2s;
    }

    #form-box input:focus {
      outline: none;
      border-color: #1565c0;
    }

    #form-box .hint {
      font-size: .72rem;
      color: #888;
      margin-top: -8px;
      margin-bottom: 10px;
    }

    #btn-add {
      width: 100%;
      padding: 12px;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      touch-action: manipulation;
    }

    #btn-add:hover { background: #0d47a1; }
    #btn-add:active { background: #0a3880; }
    #btn-add:disabled { background: #90a4ae; cursor: not-allowed; }

    #status-msg {
      margin-top: 8px;
      font-size: .85rem;
      min-height: 1.2em;
      text-align: center;
    }

    .msg-ok  { color: #2e7d32; }
    .msg-err { color: #c62828; }
    .msg-inf { color: #1565c0; }

    /* lista marker */
    #list-header {
      padding: 10px 16px 6px;
      font-size: .75rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #marker-count {
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: .72rem;
      font-weight: 700;
    }

    #marker-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
      -webkit-overflow-scrolling: touch;
    }

    .marker-item {
      display: flex;
      align-items: flex-start;
      padding: 10px 8px;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: background .15s;
      border: 1px solid transparent;
      touch-action: manipulation;
    }

    .marker-item:hover  { background: #e8f0fe; border-color: #bbdefb; }
    .marker-item:active { background: #dce9fd; }

    .marker-icon {
      width: 28px;
      height: 28px;
      background: #1565c0;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      flex-shrink: 0;
      margin-right: 10px;
      margin-top: 2px;
    }

    .marker-text { flex: 1; min-width: 0; }

    .marker-name {
      font-size: .92rem;
      font-weight: 600;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marker-addr {
      font-size: .75rem;
      color: #777;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marker-coords {
      font-size: .68rem;
      color: #aaa;
      margin-top: 1px;
    }

    .btn-del {
      background: none;
      border: none;
      color: #bbb;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      margin-top: 0;
      transition: color .15s;
      touch-action: manipulation;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .btn-del:hover  { color: #c62828; background: #fdecea; }
    .btn-del:active { color: #b71c1c; }

    #empty-msg {
      text-align: center;
      color: #bbb;
      font-size: .85rem;
      padding: 24px 0;
    }

    /* ───── MAPPA ───── */
    #map-wrap {
      flex: 1;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* spinner */
    .spin {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* bottone adatta vista */
    #btn-fitall {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: .85rem;
      font-weight: 600;
      color: #1565c0;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
      transition: background .15s, box-shadow .15s;
      touch-action: manipulation;
    }
    #btn-fitall:hover  { background: #e8f0fe; box-shadow: 0 3px 8px rgba(0,0,0,.22); }
    #btn-fitall:active { background: #c5cae9; }

    /* ───── MOBILE BOTTOM DRAWER ───── */
    @media (max-width: 640px) {
      body {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        min-width: unset;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 2000;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,.18);
        max-height: 75dvh;
        transition: transform .35s cubic-bezier(.4,0,.2,1);
        transform: translateY(calc(100% - 64px));
      }

      #sidebar.open {
        transform: translateY(0);
      }

      /* maniglia visibile del drawer */
      #drawer-handle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        height: 64px;
        cursor: pointer;
        background: #1565c0;
        border-radius: 20px 20px 0 0;
        touch-action: manipulation;
        flex-shrink: 0;
      }

      #drawer-handle-left {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
      }

      #drawer-handle-pill {
        display: none;
      }

      #drawer-title {
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
      }

      #drawer-badge {
        background: rgba(255,255,255,.25);
        color: #fff;
        border-radius: 10px;
        padding: 2px 9px;
        font-size: .78rem;
        font-weight: 700;
      }

      #drawer-arrow {
        color: rgba(255,255,255,.8);
        font-size: 1.3rem;
        transition: transform .3s;
      }

      #sidebar.open #drawer-arrow {
        transform: rotate(180deg);
      }

      /* nasconde l'header originale su mobile (usiamo drawer-handle) */
      #sidebar-header {
        display: none;
      }

      /* il contenuto del drawer è scrollabile */
      #sidebar-inner {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      #map-wrap {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 0;
      }

      #btn-fitall {
        top: auto;
        bottom: 80px;
        right: 14px;
        padding: 11px 16px;
        font-size: .9rem;
      }

      /* bottone aggiungi su mobile più grande */
      #btn-add {
        padding: 14px;
        font-size: 1.05rem;
      }

      #form-box input {
        padding: 12px 14px;
        font-size: 1rem;
      }

      .marker-item {
        padding: 12px 8px;
      }
    }

    /* su schermi grandi nascondi drawer-handle */
    @media (min-width: 641px) {
      #drawer-handle { display: none; }
      #sidebar-inner {
        display: contents;
      }
    }
  </style>
</head>
<body>

<!-- ═══════════════ MAPPA ═══════════════ -->
<div id="map-wrap">
  <div id="map"></div>
  <button id="btn-fitall" onclick="adattaVista()" title="Mostra tutti i punti">⊞ Tutti i punti</button>
</div>

<!-- ═══════════════ SIDEBAR / DRAWER ═══════════════ -->
<div id="sidebar">
  <!-- handle visibile solo su mobile -->
  <div id="drawer-handle" onclick="toggleDrawer()" role="button" aria-label="Apri pannello">
    <div id="drawer-handle-left">
      <span>📍</span>
      <span id="drawer-title">Mappa Impianti</span>
      <span id="drawer-badge">0</span>
    </div>
    <span id="drawer-arrow">▲</span>
  </div>

  <div id="sidebar-inner">
    <div id="sidebar-header">
      <h1>📍 Mappa Impianti</h1>
      <p>Aggiungi e gestisci i tuoi punti</p>
      <p id="sync-time" style="font-size:.7rem;opacity:.65;margin-top:4px;"></p>
    </div>

    <div id="form-box">
      <label for="inp-nome">Nome</label>
      <input id="inp-nome" type="text" placeholder="es. Stabilimento Nord" autocomplete="off" />

      <label for="inp-pos">Posizione</label>
      <input id="inp-pos" type="text" placeholder="es. Via Roma 1, Milano" autocomplete="off" />
      <p class="hint">Indirizzo oppure lat,lng (es. 45.46,9.19)</p>

      <button id="btn-add" onclick="aggiungiMarker()">➕ Aggiungi</button>
      <div id="status-msg"></div>
    </div>

    <div id="list-header">
      Punti salvati
      <span id="marker-count">0</span>
    </div>

    <div id="marker-list">
      <div id="empty-msg">Nessun punto ancora</div>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
// ─── Mappa ───────────────────────────────────────────────────────────────────
const map = L.map('map').setView([42.5, 12.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18
}).addTo(map);

const bluIcon = L.icon({
  iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
  shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34],
  shadowSize: [41, 41]
});

// ─── Stato ───────────────────────────────────────────────────────────────────
let markers = {};   // id → { data, leafletMarker }

// localStorage: delta rispetto al CSV
// { aggiunte: [{id,nome,indirizzo,lat,lng}], eliminati: Set<id> }
const LS_KEY = 'eps_mappa_delta';

function lsLeggi() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    return { aggiunte: d.aggiunte || [], eliminati: new Set(d.eliminati || []) };
  } catch { return { aggiunte: [], eliminati: new Set() }; }
}

function lsSalva(delta) {
  localStorage.setItem(LS_KEY, JSON.stringify({
    aggiunte: delta.aggiunte,
    eliminati: [...delta.eliminati]
  }));
}

// ─── Parser CSV robusto (gestisce campi quotati con virgole interne) ──────────
function parseCSV(testo) {
  const righe = [];
  const linee = testo.trim().split('\n');
  const header = splitCSVRiga(linee[0]);
  for (let i = 1; i < linee.length; i++) {
    const valori = splitCSVRiga(linee[i]);
    if (valori.length < header.length) continue;
    const obj = {};
    header.forEach((h, idx) => { obj[h.trim()] = valori[idx]; });
    righe.push(obj);
  }
  return righe;
}

function splitCSVRiga(riga) {
  const campi = [];
  let cur = '', dentro = false;
  for (let i = 0; i < riga.length; i++) {
    const c = riga[i];
    if (c === '"') {
      if (dentro && riga[i+1] === '"') { cur += '"'; i++; }
      else { dentro = !dentro; }
    } else if (c === ',' && !dentro) {
      campi.push(cur.trim());
      cur = '';
    } else {
      cur += c;
    }
  }
  campi.push(cur.trim());
  return campi;
}

function idCasuale() {
  return 'u_' + Math.random().toString(36).slice(2, 10);
}

// ─── Aggiunge un marker alla mappa (senza toccare lo stato delta) ─────────────
function aggiungiAllaUI(m) {
  const lat = parseFloat(m.lat);
  const lng = parseFloat(m.lng);
  if (isNaN(lat) || isNaN(lng)) return;
  const lm = L.marker([lat, lng], { icon: bluIcon })
    .addTo(map)
    .bindPopup(`<b>${esc(m.nome)}</b><br>${esc(m.indirizzo)}<br><small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>`);
  markers[m.id] = { data: m, leafletMarker: lm };
}

// ─── Caricamento: CSV + delta localStorage ────────────────────────────────────
async function caricaMarkers() {
  const delta = lsLeggi();
  let csvLista = [];

  try {
    const res = await fetch('markers.csv');
    if (res.ok) {
      const testo = await res.text();
      csvLista = parseCSV(testo);
    }
  } catch(e) { /* file non disponibile, va bene */ }

  // unisci: CSV prima, poi aggiunte utente, escludi eliminati
  const tutti = [...csvLista, ...delta.aggiunte];
  for (const m of tutti) {
    if (!delta.eliminati.has(m.id)) {
      aggiungiAllaUI(m);
    }
  }

  renderLista();
  aggiornaContatore();

  if (Object.keys(markers).length > 1) {
    adattaVista();
  }
}

// ─── Aggiunge un nuovo marker (geocoding + salva nel delta) ──────────────────
async function aggiungiMarker() {
  const nome = document.getElementById('inp-nome').value.trim();
  const pos  = document.getElementById('inp-pos').value.trim();

  if (!nome || !pos) { setMsg('Inserisci nome e posizione', 'err'); return; }

  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Ricerca...';

  let lat, lng, indirizzo;

  const coordMatch = pos.match(/^(-?\d+\.?\d*)\s*[,;\s]\s*(-?\d+\.?\d*)$/);
  if (coordMatch) {
    lat = parseFloat(coordMatch[1]);
    lng = parseFloat(coordMatch[2]);
    indirizzo = pos;
  } else {
    setMsg('Geocoding in corso...', 'inf');
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(pos)}&format=json&limit=1`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
      const data = await res.json();
      if (!data.length) {
        setMsg('Posizione non trovata — prova lat,lng o indirizzo più preciso', 'err');
        ripristinaBttn(); return;
      }
      lat = parseFloat(data[0].lat);
      lng = parseFloat(data[0].lon);
      indirizzo = data[0].display_name;
    } catch(e) {
      setMsg('Errore geocoding', 'err');
      ripristinaBttn(); return;
    }
  }

  const m = { id: idCasuale(), nome, indirizzo: indirizzo || '', lat: String(lat), lng: String(lng) };

  // aggiorna delta
  const delta = lsLeggi();
  delta.aggiunte.push(m);
  lsSalva(delta);

  aggiungiAllaUI(m);
  renderLista();
  aggiornaContatore();
  map.setView([lat, lng], 13);
  markers[m.id].leafletMarker.openPopup();
  setMsg(`✓ "${nome}" aggiunto`, 'ok');
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-pos').value = '';
  ripristinaBttn();
}

// ─── Elimina marker ───────────────────────────────────────────────────────────
function eliminaMarker(id, e) {
  e.stopPropagation();
  if (!confirm('Eliminare questo punto?')) return;
  map.removeLayer(markers[id].leafletMarker);
  delete markers[id];

  // salva nel delta
  const delta = lsLeggi();
  delta.eliminati.add(id);
  // se era un'aggiunta utente, rimuovila anche da aggiunte
  delta.aggiunte = delta.aggiunte.filter(m => m.id !== id);
  lsSalva(delta);

  renderLista();
  aggiornaContatore();
}

// ─── Adatta vista a tutti i marker ───────────────────────────────────────────
function adattaVista() {
  const coords = Object.values(markers).map(m => [parseFloat(m.data.lat), parseFloat(m.data.lng)]);
  if (!coords.length) return;
  if (coords.length === 1) { map.setView(coords[0], 13); }
  else { map.fitBounds(coords, { padding: [40, 40] }); }
}

// ─── Centra mappa su marker ───────────────────────────────────────────────────
function centrareSu(id) {
  const m = markers[id];
  if (!m) return;
  map.setView([parseFloat(m.data.lat), parseFloat(m.data.lng)], 14);
  m.leafletMarker.openPopup();
  if (window.innerWidth <= 640) chiudiDrawer();
}

// ─── Render lista sidebar ─────────────────────────────────────────────────────
function renderLista() {
  const lista = document.getElementById('marker-list');
  const ids = Object.keys(markers);

  if (!ids.length) {
    lista.innerHTML = '<div id="empty-msg">Nessun punto ancora</div>';
    return;
  }

  ids.sort((a, b) => markers[a].data.nome.localeCompare(markers[b].data.nome, 'it'));
  lista.innerHTML = ids.map(id => {
    const m = markers[id].data;
    const lat = parseFloat(m.lat).toFixed(4);
    const lng = parseFloat(m.lng).toFixed(4);
    return `
      <div class="marker-item" onclick="centrareSu('${m.id}')">
        <div class="marker-icon"></div>
        <div class="marker-text">
          <div class="marker-name">${esc(m.nome)}</div>
          <div class="marker-addr">${esc(m.indirizzo) || '—'}</div>
          <div class="marker-coords">${lat}, ${lng}</div>
        </div>
        <button class="btn-del" title="Elimina" onclick="eliminaMarker('${m.id}', event)">✕</button>
      </div>`;
  }).join('');
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function aggiornaContatore() {
  const n = Object.keys(markers).length;
  document.getElementById('marker-count').textContent = n;
  const badge = document.getElementById('drawer-badge');
  if (badge) badge.textContent = n;
}

function setMsg(txt, tipo) {
  const el = document.getElementById('status-msg');
  el.textContent = txt;
  el.className = tipo === 'ok' ? 'msg-ok' : tipo === 'err' ? 'msg-err' : 'msg-inf';
  if (tipo === 'ok') setTimeout(() => { el.textContent = ''; }, 3000);
}

function ripristinaBttn() {
  const btn = document.getElementById('btn-add');
  btn.disabled = false;
  btn.innerHTML = '➕ Aggiungi';
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// invio con Enter
document.getElementById('inp-pos').addEventListener('keydown', e => {
  if (e.key === 'Enter') aggiungiMarker();
});
document.getElementById('inp-nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inp-pos').focus();
});

// ─── Mobile drawer ───────────────────────────────────────────────────────────
function toggleDrawer() {
  document.getElementById('sidebar').classList.toggle('open');
}

function chiudiDrawer() {
  document.getElementById('sidebar').classList.remove('open');
}

document.getElementById('map').addEventListener('click', () => {
  if (window.innerWidth <= 640) chiudiDrawer();
});

// ─── Avvio ────────────────────────────────────────────────────────────────────
caricaMarkers();
</script>
</body>
</html>
