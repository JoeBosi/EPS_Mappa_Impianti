<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Editor CSV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;display:flex;flex-direction:column;height:100dvh}
    #login-screen{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99}
    #login-box{background:#fff;border-radius:10px;padding:28px 24px;width:300px;text-align:center}
    #login-box h2{font-size:1rem;margin-bottom:14px}
    #login-password{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:.95rem;margin-bottom:10px}
    #btn-login{width:100%;padding:8px;background:#1565c0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.9rem}
    #login-msg{font-size:.78rem;color:#c62828;margin-top:6px;min-height:1em}
    header{background:#1565c0;color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    header h1{font-size:.95rem;font-weight:600}
    header a{color:#90caf9;font-size:.8rem;text-decoration:none}
    header a:hover{text-decoration:underline}
    .spacer{flex:1}
    .bar{background:#fff;border-bottom:1px solid #ddd;padding:7px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
    .bar select{padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:.82rem}
    .bar button{padding:6px 14px;border:none;border-radius:6px;font-size:.82rem;cursor:pointer;font-weight:600}
    #btn-load{background:#1565c0;color:#fff}
    #btn-save{background:#2e7d32;color:#fff}
    #btn-save:disabled{background:#90a4ae;cursor:not-allowed}
    #btn-copy{background:#607d8b;color:#fff}
    #msg{font-size:.78rem;color:#555}
    .token-row{display:flex;align-items:center;gap:6px;margin-left:auto}
    .token-row label{font-size:.72rem;color:#666;white-space:nowrap}
    .token-row input{padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:.78rem;width:170px}
    .token-row button{padding:5px 10px;background:#555;color:#fff;border:none;border-radius:6px;font-size:.75rem;cursor:pointer}
    #token-stato{font-size:.7rem;white-space:nowrap}
    #editor{flex:1;display:block;width:100%;padding:12px;font-family:monospace;font-size:.8rem;border:none;outline:none;resize:none;background:#fff;line-height:1.5}
    #grid-view{flex:1;overflow:auto;background:#fff;display:none}
    #grid-view table{width:100%;border-collapse:collapse;font-size:.8rem;table-layout:auto}
    #grid-view th{background:#e3f2fd;padding:8px 6px;border:1px solid #90caf9;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:10}
    #grid-view td{padding:4px 6px;border:1px solid #ddd;min-width:60px;max-width:300px}
    #grid-view td input{width:100%;padding:3px 5px;border:1px solid transparent;font-size:.8rem;font-family:inherit;background:transparent}
    #grid-view td input:focus{background:#fff;border-color:#1565c0;outline:none}
    #grid-view tr:hover td{background:#f5f5f5}
    #grid-view tr:nth-child(even) td{background:#fafafa}
    #grid-view tr:nth-child(even):hover td{background:#f0f0f0}
    .view-toggle{display:flex;gap:4px}
    .view-toggle button{padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#f5f5f5;font-size:.75rem;cursor:pointer}
    .view-toggle button.active{background:#1565c0;color:#fff;border-color:#1565c0}
  </style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2>🔒 Accesso riservato</h2>
    <input id="login-password" type="password" placeholder="Password" autofocus/>
    <button id="btn-login" onclick="login()">Entra</button>
    <div id="login-msg"></div>
  </div>
</div>

<header>
  <h1>📋 Editor CSV</h1>
  <a href="index.html">← Mappa</a>
</header>

<div class="bar">
  <select id="sel-file">
    <option value="fornitori.csv">fornitori.csv</option>
    <option value="markers.csv">markers.csv</option>
  </select>
  <button id="btn-load" onclick="carica()">⬇ Carica da GitHub</button>
  <button id="btn-save" onclick="salva()" disabled>💾 Salva su GitHub</button>
  <button id="btn-copy" onclick="copia()">📋 Copia</button>
  <div class="view-toggle">
    <button id="view-text" class="active" onclick="switchView('text')">📝 Testo</button>
    <button id="view-grid" onclick="switchView('grid')">📊 Griglia</button>
  </div>
  <span id="msg"></span>
  <div class="token-row">
    <label>Token GitHub:</label>
    <input id="inp-token" type="password" placeholder="ghp_..."/>
    <button onclick="salvaToken()">Salva</button>
    <span id="token-stato"></span>
  </div>
</div>

<textarea id="editor" spellcheck="false" placeholder="Clicca 'Carica da GitHub' per caricare il file..."></textarea>
<div id="grid-view"><table id="grid-table"></table></div>

<script>
const PW_HASH = '0af3ee1bbb4564a23ee6dfb25d657a900f064e84373f0697e0af6a6fb0f5ebf7';
const LS_TOKEN = 'eps_gh_token';
const GH_OWNER = 'JoeBosi', GH_REPO = 'EPS_Mappa_Impianti';
let currentSha = '';

async function sha256(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function login(){
  const pw=document.getElementById('login-password').value;
  if(await sha256(pw)===PW_HASH){
    sessionStorage.setItem('eps_mappa_auth','1');
    document.getElementById('login-screen').style.display='none';
    aggiornaTkStato();
  } else {
    document.getElementById('login-msg').textContent='Password non corretta';
    document.getElementById('login-password').value='';
  }
}
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
if(sessionStorage.getItem('eps_mappa_auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  aggiornaTkStato();
}

function getToken(){return localStorage.getItem(LS_TOKEN)||'';}
function salvaToken(){
  const v=document.getElementById('inp-token').value.trim();
  if(!v)return;
  localStorage.setItem(LS_TOKEN,v);
  document.getElementById('inp-token').value='';
  aggiornaTkStato();
}
function aggiornaTkStato(){
  const el=document.getElementById('token-stato');
  const ok=!!getToken();
  el.textContent=ok?'✓ presente':'⚠ mancante';
  el.style.color=ok?'#2e7d32':'#c62828';
}

function setMsg(t,c){const el=document.getElementById('msg');el.textContent=t;el.style.color=c||'#555';}

async function carica(){
  const file=document.getElementById('sel-file').value;
  setMsg('⏳ Caricamento...','#555');
  try{
    const res=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${file}`);
    if(!res.ok)throw new Error('Errore '+res.status);
    const info=await res.json();
    currentSha=info.sha;
    let csv=atob(info.content.replace(/\n/g,''));
    csv=csv.replace(/^ï»¿/,'').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    document.getElementById('editor').value=csv;
    document.getElementById('btn-save').disabled=false;
    setMsg('✓ Caricato','#2e7d32');
  }catch(e){setMsg('⚠ '+e.message,'#c62828');}
}

async function salva(){
  const token=getToken();
  if(!token){setMsg('⚠ Inserisci prima il token GitHub','#c62828');return;}
  const file=document.getElementById('sel-file').value;
  const csv=document.getElementById('editor').value;
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='⏳ Salvataggio...';
  setMsg('','');
  try{
    // Rileggo SHA aggiornato
    const gr=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${file}`,
      {headers:{'Authorization':'token '+token}});
    if(!gr.ok)throw new Error('Lettura fallita (token errato?)');
    currentSha=(await gr.json()).sha;

    const b64=btoa(unescape(encodeURIComponent(csv)));
    const pr=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${file}`,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({message:`editor: aggiorna ${file}`,content:b64,sha:currentSha})
    });
    if(!pr.ok){const e=await pr.json();throw new Error(e.message||'Errore PUT');}
    const data=await pr.json();
    currentSha=data.content.sha;
    setMsg('✓ Salvato su GitHub alle '+new Date().toLocaleTimeString(),'#2e7d32');
  }catch(e){setMsg('⚠ '+e.message,'#c62828');}
  finally{btn.disabled=false;btn.textContent='💾 Salva su GitHub';}
}

function copia(){
  navigator.clipboard.writeText(document.getElementById('editor').value)
    .then(()=>setMsg('✓ Copiato negli appunti','#2e7d32'));
}

// ─── Vista Griglia ───────────────────────────────────────────────────────────
let currentView = 'text';

function switchView(view){
  currentView = view;
  const editor = document.getElementById('editor');
  const gridView = document.getElementById('grid-view');
  const btnText = document.getElementById('view-text');
  const btnGrid = document.getElementById('view-grid');
  
  if(view === 'grid'){
    // Converti CSV in griglia
    parseCSVToGrid();
    editor.style.display = 'none';
    gridView.style.display = 'block';
    btnText.classList.remove('active');
    btnGrid.classList.add('active');
  } else {
    // Converti griglia in CSV
    updateEditorFromGrid();
    gridView.style.display = 'none';
    editor.style.display = 'block';
    btnGrid.classList.remove('active');
    btnText.classList.add('active');
  }
}

function parseCSVToGrid(){
  const csv = document.getElementById('editor').value;
  const table = document.getElementById('grid-table');
  const rows = parseCSV(csv);
  
  let html = '<thead><tr>';
  if(rows.length > 0){
    rows[0].forEach((cell, idx) => {
      html += `<th contenteditable="true" data-col="${idx}">${esc(cell)}</th>`;
    });
    html += '</tr></thead><tbody>';
    
    for(let i = 1; i < rows.length; i++){
      html += '<tr>';
      rows[i].forEach((cell, idx) => {
        html += `<td><input type="text" value="${esc(cell)}" data-row="${i}" data-col="${idx}" onchange="markDirty()"></td>`;
      });
      html += '</tr>';
    }
    html += '</tbody>';
  }
  table.innerHTML = html;
}

function updateEditorFromGrid(){
  const table = document.getElementById('grid-table');
  if(!table.querySelector('th')) return; // Griglia vuota
  
  let rows = [];
  
  // Header
  const headerCells = table.querySelectorAll('thead th');
  let headerRow = [];
  headerCells.forEach(th => headerRow.push(th.textContent.trim()));
  rows.push(headerRow);
  
  // Data rows
  const dataRows = table.querySelectorAll('tbody tr');
  dataRows.forEach(tr => {
    let row = [];
    tr.querySelectorAll('td input').forEach(input => row.push(input.value));
    rows.push(row);
  });
  
  // Convert to CSV
  document.getElementById('editor').value = rowsToCSV(rows);
}

function parseCSV(text){
  const result = [];
  const lines = text.replace(/\r/g, '\n').split('\n').filter(l => l.trim());
  
  for(let line of lines){
    const row = [];
    let cell = '';
    let inQuotes = false;
    
    for(let i = 0; i < line.length; i++){
      const char = line[i];
      const next = line[i + 1];
      
      if(!inQuotes && char === '"'){
        inQuotes = true;
      } else if(inQuotes && char === '"' && next === '"'){
        cell += '"';
        i++;
      } else if(inQuotes && char === '"'){
        inQuotes = false;
      } else if(!inQuotes && char === ','){
        row.push(cell.trim());
        cell = '';
      } else {
        cell += char;
      }
    }
    row.push(cell.trim());
    result.push(row);
  }
  return result;
}

function rowsToCSV(rows){
  return rows.map(row => {
    return row.map(cell => {
      // Escape se contiene virgole o newline
      if(cell.includes(',') || cell.includes('\n') || cell.includes('"')){
        return '"' + cell.replace(/"/g, '""') + '"';
      }
      return cell;
    }).join(',');
  }).join('\n');
}

function esc(str){
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function markDirty(){
  document.getElementById('btn-save').disabled = false;
}

// Aggiorna editor prima del salvataggio
const originalSalva = salva;
salva = async function(){
  if(currentView === 'grid'){
    updateEditorFromGrid();
  }
  return originalSalva();
};
</script>
</body>
</html>
